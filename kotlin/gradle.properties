# Consema Kotlin implementation — Gradle properties.
# Kotlin daemon heap: the default 512 MiB GC-thrashes on the 239-file K2
# compile (local exploration 2026-08-12: 40+ minutes without completing;
# -Xmx3g finishes the same compile in ~2 minutes; the count is the
# 2026-08-15 static count, 163 main + 76 test). The direct K2JVMCompiler
# path used by the conformance/differential jobs gives the compiler -Xmx2g
# headroom, so this keeps the Gradle path in the same memory class. Applies
# when a build goes through the wrapper: kotlin-gates drives
# .\gradlew.bat (ci-kotlin.yml, since b640af6); the kotlin-conformance /
# kotlin-differential jobs still drive K2JVMCompiler directly with their
# own -Xmx2g (ci-kotlin.yml, CONSEMA_* env pattern).
kotlin.daemon.jvmargs=-Xmx3g
