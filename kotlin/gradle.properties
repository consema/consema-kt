# Consema Kotlin implementation — Gradle properties.
# Kotlin daemon heap: the default 512 MiB GC-thrashes on the 234-file K2
# compile (local exploration 2026-08-12: 40+ minutes without completing;
# -Xmx3g finishes the same compile in ~2 minutes). The direct K2JVMCompiler
# path used by CI gives the compiler -Xmx2g headroom, so this keeps the
# Gradle path in the same memory class. Applies only when a build goes
# through the wrapper (CI still drives K2JVMCompiler directly).
kotlin.daemon.jvmargs=-Xmx3g
