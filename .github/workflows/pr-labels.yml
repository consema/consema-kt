# PR label gate (viper checks.yaml pattern): every pull request should
# carry at least one `kind:` label (kind: bug / kind: feature / kind:
# docs / kind: chore / kind: release — the taxonomy is documented in
# .github/LABELS.md). Wave-5 truthing (2026-08-15, gh api 实测): branch
# protection's required_status_checks contains only `check (all gates
# green)`, so this check is NOT a merge blocker — it reports on the PR,
# and adding a label flips it green without a rebase, but merging without
# a kind: label is currently possible. The workflow re-evaluates on every
# label change and on new commits. Only the automatic GITHUB_TOKEN is
# used; pull-requests: read is enough to read the PR labels (no comment
# posting).
# Dependabot PRs are exempt: their kind is chore by construction (the
# labeler only applies the area: core/ci/docs labels — there are no
# dependencies/github_actions labeler rules in this repository) and the
# alls-green aggregate gate still guards merges.
name: PR Labels

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  require-kind-label:
    if: github.actor != 'dependabot[bot]'
    name: "Require a kind: label"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Check minimum labels (at least one kind: label)"
        uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5.6.0
        with:
          mode: minimum
          count: 1
          labels: |
            kind: bug
            kind: feature
            kind: docs
            kind: chore
            kind: release
