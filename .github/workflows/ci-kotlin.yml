# Consema Kotlin CI (https://github.com/consema/consema/blob/main/docs/five-language-ci-design.md §1.2, §7.1): the
# Kotlin implementation joins the release gate with seven explicit jobs —
# kotlin-gates, kotlin-conformance, kotlin-differential,
# check-version-consistency, examples, kotlin-package,
# runtime-classpath-audit (added 2026-08-14, G103) — plus the aggregate
# check, 8 jobs in total (the design rejects a single shared matrix, §5.2).
# kotlin-gates runs the
# full unit-test suite and the kover 60% line-coverage gate through the
# committed Gradle wrapper (kotlin/gradlew.bat, gradle 8.14 — the design
# §7.3 L0-batch item landed with the wrapper batch, c60d31a);
# kotlin-conformance and kotlin-differential keep driving the direct JVM
# K2JVMCompiler exactly like the committed verification scripts
# (scripts/kotlin-verify-*.ps1): they compile the tests with the
# kotlinc-bundled kotlin-test.jar + kotlin-test-junit5.jar (+ the
# provisioned junit-jupiter-api-5.10.2.jar) and drive the @Test methods
# through a temp main() runner (the kotlin/verify/TestShim.kt shim was
# removed 2026-08-13 — its dead `package kotlin.test` annotation class
# would clash with kotlin-test.jar on any classpath; git history keeps it) —
# those jobs depend on the single-module compile + temp-runner + golden-env
# mode, with CONSEMA_JAVA_HOME / CONSEMA_KOTLINC environment
# overrides, and provision the pinned kotlinc 2.2.0 distribution (cached)
# on top of the Temurin 17 JDK. kotlin-conformance runs the Kotlin runner
# (the 18/519 inventory is hard-pinned in Runner.kt — the ALL_SUITES list —
# and ConformanceRunnerTest.kt asserts it, compares the computed aggregate
# digest against the provisioned manifest record, and requires every suite
# to assert its frozen case count; §2.2/§4.2; the literal digest pin
# cfd6e296da5b22b62d37b076d35bf6bbf58b0678ceddb37eea51a8b47200ab6a
# lives in this workflow — the kotlin-conformance digest step); kotlin-package runs the L5 packaging gate (gradlew jar —
# the library jar must be produced, §1.1 package row / §5.3 L5 row);
# kotlin-differential runs the bidirectional
# scripts/kotlin-verify-*.ps1 harnesses against the Rust emitters. The
# verify scripts and the toolchain layout are Windows-native (bin\java.exe,
# debug\examples\*.exe), so the five implementation jobs (kotlin-gates,
# kotlin-conformance, kotlin-differential, examples,
# runtime-classpath-audit) run on windows-latest; check-version-consistency,
# kotlin-package and the aggregate check run on ubuntu-latest. The
# runner-CLI entry point (kotlin/src/main/kotlin/consema/conformance/Cli.kt)
# came with the implementation tree inherited from the spec repository
# (repo root commit 95cf5d6 — whose commit message is the spec repo's fuzz
# evidence accumulation, unrelated to the runner batch; see CHANGELOG.md);
# its current kotlin/ path dates from the six-repo split commit 613ae2f,
# while the shared-conformance
# script (scripts/kotlin-verify-shared-conformance.ps1, §3.6/§7.2) is not
# committed yet — the fourth differential step stays deferred. No repository
# secrets are required.
#
# Coverage gate: the Gradle wrapper landed (kotlin/gradlew.bat, gradle 8.14;
# c60d31a), so kotlin-gates enforces the kover 0.9.9 line-coverage threshold
# (koverVerify, 60% minimum — the build.gradle.kts kover block; report tasks
# koverHtmlReport/koverXmlReport). The Knit-style doc-example gate landed
# with the examples job (2026-08-13): the README ```kotlin fence must equal
# kotlin/examples/Quickstart.kt after Trim and the header/package-line strip
# — the ```text command block is NOT part of the comparison surface.
#
# This repository carries the Kotlin implementation only, so the three
# conformance/differential jobs use the multi-repo checkout mode: they
# check out consema/consema (the spec repository, whose conformance/vectors
# + conformance/differential case sets, docs/fc-manifest-0.13.0.json and the
# toml.corpus.cargo-manifest fixture conformance/fixtures/toml/Cargo.toml
# are the single authority) beside this repository and copy the conformance
# data into the workspace root (the runner resolves conformance/* and the
# manifest by repository-relative path from CONSEMA_REPO=$GITHUB_WORKSPACE).
# The remaining five jobs use the single-repo checkout — no conformance data
# needed — and annotate it at their job definition: check-version-consistency,
# examples, kotlin-package, runtime-classpath-audit, and the aggregate check
# (the last one has no checkout step at all). The differential job
# additionally checks out consema/consema-rs (the Rust emitter workspace;
# the kotlin-verify-*.ps1 scripts default to <repo root>\consema-rs) and
# the scripts build the pinned emitter examples (cargo build --locked -p
# consema-conformance --example …) there. The consema/consema checkout is
# pinned by commit (ref) to 096e5f8 — the 2026-08-14 adversarial wave-2
# fix commit that carries the cfd6e296 519-case inventory (the
# digest literal cfd6e296da5b22b62d37b076d35bf6bbf58b0678ceddb37eea51a8b47200ab6a
# is asserted by the kotlin-conformance digest step) — so the provisioned
# data cannot drift with the spec repository's default branch; the
# consema-rs checkout is pinned to bd5734ea, the commit that vendored the
# same cfd6e296 519-case conformance snapshot.
name: Kotlin CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: kotlin-ci-${{ github.ref }}
  cancel-in-progress: true

# Top-tier P0: minimal token scope. Every job here only reads repository
# contents (checkout + multi-repo checkouts + running repo scripts); none
# uploads artifacts or writes check runs, so the global minimum suffices
# (cache restore works with contents: read; cache save denial is a warning
# only, per the actions/cache contract).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  kotlin-gates:
    name: kotlin gates (unit tests + kover 60% + test-only deps)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Gradle wrapper jar integrity (G87, 2026-08-14): the committed
      # gradle-wrapper.jar is a binary with no in-repo integrity anchor —
      # wrapper-validation-action compares it with the official distribution
      # before any wrapper step runs.
      - name: validate the committed Gradle wrapper jar (official distribution)
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
          ref: 096e5f840ecc714912db779706fd881405b92308 # cfd6e296 519-case conformance data pin
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore.
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      # The committed Gradle wrapper (kotlin/gradlew.bat, gradle 8.14 — the
      # design §7.3 L0-batch item landed with the wrapper batch, c60d31a)
      # drives the unit-test run. setup-gradle caches the Gradle user home:
      # the wrapper distribution (gradle-8.14-bin.zip is ~137 MB — a restore
      # skips that download) plus the dependency/Kotlin caches. The cache key
      # is composed of the runner OS, the job id, the workflow/matrix hash
      # and the git sha (gradle/actions/setup-gradle enhanced caching); it
      # does not include the Gradle version or a hash of the build files, so
      # a build-config change within one commit still restores the previous
      # cache entry. Gradle verifies distributionSha256Sum
      # (kotlin/gradle/wrapper/gradle-wrapper.properties) when it downloads
      # the distribution; a cache-restored distribution skips that path, so
      # the verification step below re-checks the restored zip's sha256
      # against the pinned sum (same threat model as the release workflow,
      # which disables Gradle caching entirely — this job keeps the cache and
      # re-verifies instead).
      - name: cache gradle user home (wrapper dist + dependency caches)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Cache-restore integrity (G87, 2026-08-14): re-verify the restored
      # wrapper-distribution zip against the pinned distributionSha256Sum —
      # the restore path never ran Gradle's own download-time check.
      - name: verify cached gradle distribution (restored zip sha256 vs pinned sum)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $props = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'kotlin\gradle\wrapper\gradle-wrapper.properties') -Raw
          $sum = [regex]::Match($props, 'distributionSha256Sum=([0-9a-fA-F]+)').Groups[1].Value
          if (-not $sum) {
            throw 'distributionSha256Sum not found in gradle-wrapper.properties'
          }
          $zip = Get-ChildItem -Path (Join-Path $env:USERPROFILE '.gradle\wrapper\dists') -Recurse -Filter 'gradle-8.14-bin.zip' | Select-Object -First 1
          if ($zip) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash
            if ($actual -ne $sum) {
              throw "cached gradle distribution sha256 mismatch (got $actual, want $sum)"
            }
            Write-Output "cached gradle distribution verified: $($zip.FullName)"
          } else {
            Write-Output 'no cached gradle distribution zip — the wrapper will download it (download-time sha256 check applies)'
          }
      # Runs every @Test method (JUnit5 platform, kotlin.test assertions)
      # and enforces the kover 0.9.9 line-coverage threshold (koverVerify,
      # 60% minimum — the build.gradle.kts kover block) — a below-threshold
      # run fails the job. CONSEMA_REPO points the conformance tests at the
      # provisioned conformance/ + docs/fc-manifest-0.13.0.json at the
      # workspace root (Runner.kt resolveRepoRoot, CONSEMA_REPO first). The
      # differential tests without their golden env vars print a documented
      # [SKIP] line and pass (§0.2 skip discipline; the verify scripts are
      # what assert RUN not SKIP).
      - name: run unit tests + kover 60% coverage gate
        shell: pwsh
        working-directory: kotlin
        env:
          CONSEMA_REPO: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat test koverVerify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Test-only-dependency policy (§1.3): the build.gradle.kts
      # dependencies block keeps every declared configuration test-scoped —
      # the runtime classpath carries only the Kotlin platform
      # (kotlin-stdlib 2.2.0, injected by the Kotlin Gradle plugin, with its
      # transitive org.jetbrains:annotations). Asserted at the source level
      # (evaluating configurations.runtimeClasspath would resolve the entire
      # dependency graph; the source-level tripwire is the documented check).
      - name: test-only-dependencies assertion (build.gradle.kts runtime-scoped declarations)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildFile = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'kotlin\build.gradle.kts') -Raw
          if ($buildFile -match '(?m)^\s*(implementation|api|compileOnly|runtimeOnly)\s*(/\*.*?\*/)?\s*[("]') {
            throw 'build.gradle.kts must keep every declared configuration test-scoped (runtime-scoped dependency found)'
          }
          if ($buildFile -notmatch '(?m)^\s*testImplementation\s*\(' -or $buildFile -notmatch '(?m)^\s*testRuntimeOnly\s*\(') {
            throw 'build.gradle.kts must declare its test-scoped dependencies (testImplementation/testRuntimeOnly)'
          }
          Write-Output 'test-only dependencies: build.gradle.kts declares only test-scoped configurations (runtime classpath carries kotlin-stdlib + annotations)'

  kotlin-conformance:
    name: kotlin conformance runner (18 suites / 519 cases)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
          ref: 096e5f840ecc714912db779706fd881405b92308 # cfd6e296 519-case conformance data pin
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore.
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      - name: cache kotlinc 2.2.0 distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/kotlinc-2.2.0
          key: kotlinc-2.2.0
      - name: provision kotlinc 2.2.0 + CONSEMA_* environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dist = Join-Path $env:RUNNER_TEMP 'kotlinc-2.2.0'
          # The kotlin-compiler zip extracts a top-level kotlinc/ directory
          # (lib\kotlin-compiler.jar sits under it); the guard must test the
          # real layout so a cache-restored distribution is actually reused
          # instead of being re-downloaded every run.
          if (-not (Test-Path (Join-Path $dist 'kotlinc\lib\kotlin-compiler.jar'))) {
            $zip = Join-Path $env:RUNNER_TEMP 'kotlin-compiler-2.2.0.zip'
            if (-not (Test-Path $zip)) {
              Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip' -OutFile $zip
            }
            # Pinned upstream artifact (JetBrains kotlinc 2.2.0 release):
            # verify the sha256 so an upstream drift or a poisoned cache
            # entry fails the job instead of being used.
            $expectedKotlincSha256 = '1adb6f1a5845ba0aa5a59e412e44c8e405236b957de1a9683619f1dca3b16932'
            $actualKotlincSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
            if ($actualKotlincSha256 -ne $expectedKotlincSha256) {
              throw "kotlin-compiler-2.2.0.zip sha256 mismatch (got $actualKotlincSha256, want $expectedKotlincSha256)"
            }
            Expand-Archive -LiteralPath $zip -DestinationPath $dist -Force
          }
          $compiler = Get-ChildItem -Path $dist -Recurse -Filter 'kotlin-compiler.jar' | Select-Object -First 1
          if (-not $compiler) {
            throw 'kotlinc distribution not found after extraction'
          }
          # Verify the extracted compiler jar on every use — including a
          # cache-restored distribution (the cache key is a constant, so the
          # download branch is not the only supply path).
          $expectedKotlincJarSha256 = 'cb2b7b0b82ad5b6ddc2e8c6c41c73e837a2b42e2abf64af64dda1b6173609790'
          $actualKotlincJarSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $compiler.FullName).Hash
          if ($actualKotlincJarSha256 -ne $expectedKotlincJarSha256) {
            throw "kotlin-compiler.jar sha256 mismatch (got $actualKotlincJarSha256, want $expectedKotlincJarSha256)"
          }
          $kotlincRoot = $compiler.Directory.Parent.FullName
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CONSEMA_KOTLINC=$kotlincRoot`r`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CONSEMA_JAVA_HOME=$env:JAVA_HOME`r`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "KOTLIN_WORK=$env:RUNNER_TEMP\kotlin-work`r`n")
          Write-Output "kotlinc 2.2.0 provisioned at $kotlincRoot"
      # Aggregate digest literal pin (fc-manifest-0.13.0.json,
      # digests.conformance_suite.aggregate_sha256; the 2026-08-12 P2-B vector
      # reinforcement inventory): computes the aggregate over the provisioned
      # conformance/vectors/*.json (file-name byte-order sort, per-file
      # sha256 lowercase hex, lines `{basename}:{digest}` joined with '\n'
      # without a trailing newline, then sha256 of that UTF-8 string) and
      # compares it with the pinned literal — a manifest or vector drift
      # fails the job instead of being accepted as self-consistent.
      - name: verify the conformance/vectors aggregate digest (literal pin)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vectorsDir = Join-Path $env:GITHUB_WORKSPACE 'conformance\vectors'
          $names = @(Get-ChildItem -LiteralPath $vectorsDir -Filter '*.json' | ForEach-Object { $_.Name })
          [System.Array]::Sort($names, [System.StringComparer]::Ordinal)
          $lines = @()
          $caseTotal = 0
          foreach ($name in $names) {
            $path = Join-Path $vectorsDir $name
            $vector = Get-Content $path -Raw -Encoding UTF8 | ConvertFrom-Json
            $caseTotal += @($vector.cases).Count
            $digest = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$name`:$digest"
          }
          $aggregateText = [string]::Join("`n", $lines)
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $aggregateBytes = $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($aggregateText))
          }
          finally {
            $sha.Dispose()
          }
          $computed = ([System.BitConverter]::ToString($aggregateBytes)).Replace('-', '').ToLowerInvariant()
          $expected = 'cfd6e296da5b22b62d37b076d35bf6bbf58b0678ceddb37eea51a8b47200ab6a'
          if ($names.Count -ne 18 -or $caseTotal -ne 519 -or $computed -ne $expected) {
            throw "vectors digest mismatch: computed $computed, pinned $expected ($($names.Count) suites / $caseTotal cases vs pinned 18 / 519)"
          }
          Write-Output "vectors aggregate digest verified: $computed (18 suites / 519 cases)"
      # junit-jupiter-api-5.10.2.jar is required at test compile time
      # (kotlin.test resolves @Test through the kotlin-test-junit5 typealias
      # to org.junit.jupiter.api.Test). kotlinc bundles kotlin-test.jar and
      # kotlin-test-junit5.jar, so only this jar is provisioned into the
      # repo-local verify lib (the scripts/kotlin-verify-*.ps1 download
      # idiom; the compile step below guards on the same path).
      - name: provision junit-jupiter-api 5.10.2 jar (repo verify lib)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $lib = Join-Path $env:GITHUB_WORKSPACE 'kotlin\build\verify\lib'
          New-Item -ItemType Directory -Force $lib | Out-Null
          $junitJar = Join-Path $lib 'junit-jupiter-api-5.10.2.jar'
          if (-not (Test-Path $junitJar)) {
            Write-Output 'downloading junit-jupiter-api-5.10.2.jar (needed by kotlin-test-junit5)...'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://repo1.maven.org/maven2/org/junit/jupiter/junit-jupiter-api/5.10.2/junit-jupiter-api-5.10.2.jar' -OutFile $junitJar
          }
          # Pinned upstream artifact (Maven Central, 5.10.2): verify the
          # sha256 so an upstream drift fails the job instead of being used.
          $expectedJunitSha256 = 'afff77c186cd317275803872fa5133aa801fd6ac40bd91c78a6cf8009b4b17cc'
          $actualJunitSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $junitJar).Hash
          if ($actualJunitSha256 -ne $expectedJunitSha256) {
            throw "junit-jupiter-api-5.10.2.jar sha256 mismatch (got $actualJunitSha256, want $expectedJunitSha256)"
          }
          Write-Output "junit-jupiter-api-5.10.2.jar provisioned at $junitJar"
      - name: compile main sources (K2JVMCompiler)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $java = Join-Path $env:CONSEMA_JAVA_HOME 'bin\java.exe'
          $kotlinc = $env:CONSEMA_KOTLINC
          $kotlinDir = Join-Path $env:GITHUB_WORKSPACE 'kotlin'
          $work = $env:KOTLIN_WORK
          $mainOut = Join-Path $work 'main'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Force $mainOut | Out-Null
          & $java -Xmx2g -cp "$kotlinc\lib\*" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler -jvm-target 17 -d $mainOut (Join-Path $kotlinDir 'src\main\kotlin')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "main sources compiled into $mainOut"
      # Compiles the runner test (ConformanceRunnerTest.kt — the digest and
      # 18/519 hard pins) together with a temp main() test runner, the
      # pattern of scripts/kotlin-verify-byte-parity.ps1 (kotlin.test shim
      # not needed: the runner drives the @Test methods directly).
      - name: compile the conformance runner test + temp main() runner (K2JVMCompiler)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $java = Join-Path $env:CONSEMA_JAVA_HOME 'bin\java.exe'
          $kotlinc = $env:CONSEMA_KOTLINC
          $kotlinDir = Join-Path $env:GITHUB_WORKSPACE 'kotlin'
          $work = $env:KOTLIN_WORK
          $mainOut = Join-Path $work 'main'
          $runnerOut = Join-Path $work 'runner'
          New-Item -ItemType Directory -Force $runnerOut | Out-Null
          $kotlinTestJar = Join-Path $kotlinc 'lib\kotlin-test.jar'
          $kotlinTestJunit5Jar = Join-Path $kotlinc 'lib\kotlin-test-junit5.jar'
          $junitJar = Join-Path $kotlinDir 'build\verify\lib\junit-jupiter-api-5.10.2.jar'
          if (-not (Test-Path $kotlinTestJar)) { throw "kotlin-test.jar not found: $kotlinTestJar" }
          if (-not (Test-Path $kotlinTestJunit5Jar)) { throw "kotlin-test-junit5.jar not found: $kotlinTestJunit5Jar" }
          if (-not (Test-Path $junitJar)) { throw "junit-jupiter-api jar not found: $junitJar" }
          $runnerSource = Join-Path $work 'ConformanceTestRunner.kt'
          @'
          package consema.conformance

          import kotlin.system.exitProcess

          fun main(args: Array<String>) {
              var failures = 0
              var runs = 0
              fun run(name: String, block: () -> Unit) {
                  runs++
                  try {
                      block()
                      println("PASS $name")
                  } catch (e: Throwable) {
                      failures++
                      println("FAIL $name: ${e.message}")
                      e.printStackTrace()
                  }
              }
              val tests = mapOf(
                  "ConformanceRunnerTest.aggregateDigestMatchesTheManifest" to { ConformanceRunnerTest().aggregateDigestMatchesTheManifest() },
                  "ConformanceRunnerTest.allEighteenSuitesPassFiveHundredNineteenCases" to { ConformanceRunnerTest().allEighteenSuitesPassFiveHundredNineteenCases() },
                  "ConformanceRunnerTest.everySuiteAssertsItsFrozenCaseCount" to { ConformanceRunnerTest().everySuiteAssertsItsFrozenCaseCount() },
              )
              for (arg in args) {
                  val block = tests[arg] ?: error("unknown test $arg")
                  run(arg, block)
              }
              println("tests: $runs run, $failures failed")
              if (runs == 0) {
                  println("no tests ran — refusing to pass")
                  exitProcess(1)
              }
              if (failures > 0) exitProcess(1)
          }
          '@ | Set-Content -Path $runnerSource -Encoding utf8
          $testClasspath = "$mainOut;$kotlinTestJar;$kotlinTestJunit5Jar;$junitJar"
          & $java -Xmx2g -cp "$kotlinc\lib\*" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler -jvm-target 17 -classpath $testClasspath -d $runnerOut (Join-Path $kotlinDir 'src\test\kotlin\consema\conformance') $runnerSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "conformance runner test compiled into $runnerOut"
      # The digest literal pin step above verified the provisioned vectors
      # against cfd6e296da5b22b62d37b076d35bf6bbf58b0678ceddb37eea51a8b47200ab6a
      # (fc-manifest-0.13.0.json, digests.conformance_suite.aggregate_sha256).
      # ConformanceRunnerTest then asserts the
      # 18 suites / 519 cases inventory, the per-suite counts, and zero
      # failures, and compares the computed digest against the provisioned
      # manifest record (§4.2 hard pins in the runner). CONSEMA_REPO points
      # the runner at the checkout, where the provision step placed
      # conformance/ and docs/fc-manifest-0.13.0.json.
      - name: run the conformance runner (18/519 + manifest-record digest)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $java = Join-Path $env:CONSEMA_JAVA_HOME 'bin\java.exe'
          $kotlinc = $env:CONSEMA_KOTLINC
          $work = $env:KOTLIN_WORK
          $mainOut = Join-Path $work 'main'
          $runnerOut = Join-Path $work 'runner'
          $kotlinTestJar = Join-Path $kotlinc 'lib\kotlin-test.jar'
          $stdlib = Join-Path $kotlinc 'lib\kotlin-stdlib.jar'
          $env:CONSEMA_REPO = $env:GITHUB_WORKSPACE
          $runCp = "$mainOut;$runnerOut;$stdlib;$kotlinTestJar"
          & $java -Xmx2g -cp $runCp consema.conformance.ConformanceTestRunnerKt 'ConformanceRunnerTest.aggregateDigestMatchesTheManifest' 'ConformanceRunnerTest.allEighteenSuitesPassFiveHundredNineteenCases' 'ConformanceRunnerTest.everySuiteAssertsItsFrozenCaseCount'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # CLI smoke gate (six-repo audit G158): the runner CLI (Cli.kt main)
      # was shipped but had no executor — run it here and require exit 0
      # (RFC 0015 §5.1 success class; a conformant run must exit 0).
      - name: smoke-run the conformance CLI (Cli.kt main, must exit 0)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $java = Join-Path $env:CONSEMA_JAVA_HOME 'bin\java.exe'
          $kotlinc = $env:CONSEMA_KOTLINC
          $work = $env:KOTLIN_WORK
          $mainOut = Join-Path $work 'main'
          $stdlib = Join-Path $kotlinc 'lib\kotlin-stdlib.jar'
          $env:CONSEMA_REPO = $env:GITHUB_WORKSPACE
          & $java -Xmx2g -cp "$mainOut;$stdlib" consema.conformance.CliKt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'conformance CLI exited 0 on the provisioned data'

  kotlin-differential:
    name: kotlin differential vs Rust (byte parity + normalized + protocol exchange)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema-rs
          path: consema-rs
          ref: bd5734eab969fa7c8a1a1564d4ee50b85f3d10d6 # cfd6e296 519-case vendored conformance + emitter pin
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
          ref: 096e5f840ecc714912db779706fd881405b92308 # cfd6e296 519-case conformance data pin
      # Rust toolchain for the emitter build (G70, 2026-08-14): pinned to
      # 1.97.1 — the version the harness was locally verified with; a
      # floating 'stable' would make the differential goldens depend on the
      # runner's current stable and break replayability. The emitters are
      # built and the goldens regenerated inside this same job, so both
      # directions always use this one toolchain.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: consema-rs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore.
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      - name: cache kotlinc 2.2.0 distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/kotlinc-2.2.0
          key: kotlinc-2.2.0
      - name: provision kotlinc 2.2.0 + CONSEMA_* environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dist = Join-Path $env:RUNNER_TEMP 'kotlinc-2.2.0'
          # The kotlin-compiler zip extracts a top-level kotlinc/ directory
          # (lib\kotlin-compiler.jar sits under it); the guard must test the
          # real layout so a cache-restored distribution is actually reused
          # instead of being re-downloaded every run.
          if (-not (Test-Path (Join-Path $dist 'kotlinc\lib\kotlin-compiler.jar'))) {
            $zip = Join-Path $env:RUNNER_TEMP 'kotlin-compiler-2.2.0.zip'
            if (-not (Test-Path $zip)) {
              Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip' -OutFile $zip
            }
            # Pinned upstream artifact (JetBrains kotlinc 2.2.0 release):
            # verify the sha256 so an upstream drift or a poisoned cache
            # entry fails the job instead of being used.
            $expectedKotlincSha256 = '1adb6f1a5845ba0aa5a59e412e44c8e405236b957de1a9683619f1dca3b16932'
            $actualKotlincSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
            if ($actualKotlincSha256 -ne $expectedKotlincSha256) {
              throw "kotlin-compiler-2.2.0.zip sha256 mismatch (got $actualKotlincSha256, want $expectedKotlincSha256)"
            }
            Expand-Archive -LiteralPath $zip -DestinationPath $dist -Force
          }
          $compiler = Get-ChildItem -Path $dist -Recurse -Filter 'kotlin-compiler.jar' | Select-Object -First 1
          if (-not $compiler) {
            throw 'kotlinc distribution not found after extraction'
          }
          # Verify the extracted compiler jar on every use — including a
          # cache-restored distribution (the cache key is a constant, so the
          # download branch is not the only supply path).
          $expectedKotlincJarSha256 = 'cb2b7b0b82ad5b6ddc2e8c6c41c73e837a2b42e2abf64af64dda1b6173609790'
          $actualKotlincJarSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $compiler.FullName).Hash
          if ($actualKotlincJarSha256 -ne $expectedKotlincJarSha256) {
            throw "kotlin-compiler.jar sha256 mismatch (got $actualKotlincJarSha256, want $expectedKotlincJarSha256)"
          }
          $kotlincRoot = $compiler.Directory.Parent.FullName
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CONSEMA_KOTLINC=$kotlincRoot`r`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CONSEMA_JAVA_HOME=$env:JAVA_HOME`r`n")
          Write-Output "kotlinc 2.2.0 provisioned at $kotlincRoot"
      # Each script builds the pinned Rust emitter inside the consema-rs
      # checkout (cargo build --locked -p consema-conformance --example …;
      # the scripts default to <repo root>\consema-rs), compiles the Kotlin
      # side with the direct K2JVMCompiler, provisions the golden/evidence
      # directories, runs the tests with the golden env vars set, closes the
      # reverse direction, and asserts the tests RAN (not skipped).
      - name: scripts/kotlin-verify-byte-parity.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/kotlin-verify-byte-parity.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/kotlin-verify-normalized-differential.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/kotlin-verify-normalized-differential.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/kotlin-verify-protocol-exchange.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/kotlin-verify-protocol-exchange.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Version-consistency gate (tokio check-readme pattern): the README
  # "Version:" line must equal the kotlin/build.gradle.kts rootProject
  # version, so a version bump that forgets the README fails CI.
  check-version-consistency:
    name: check README version vs build.gradle.kts (version consistency)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: assert build.gradle.kts version == README Version line
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' kotlin/build.gradle.kts | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::no 'version' found in kotlin/build.gradle.kts"
            exit 1
          fi
          # Whole-line exact match: a substring match would let the rc->GA
          # direction through (a stale 'Version: 1.0.0-rc.1' line contains
          # 'Version: 1.0.0' as a prefix).
          grep -qxF "Version: $version" README.md || {
            echo "::error::README.md does not declare 'Version: $version' as a whole line"
            exit 1
          }
          echo "README version consistent with build.gradle.kts: $version"
      # Extended coverage (six-repo audit G127): the README Maven coordinates
      # (快速开始, dev.consema:consema-kotlin:<version>) and the bug-report
      # template's version note must ride the same train bump. Whole-token
      # match (G74, 2026-08-14): a substring match would let the rc->GA
      # direction through ('dev.consema:consema-kotlin:1.0.0-rc.1' contains
      # 'dev.consema:consema-kotlin:1.0.0' as a prefix), so every occurrence
      # is extracted to its natural token end and compared exactly.
      - name: assert README Maven coordinates and bug-report template version match
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' kotlin/build.gradle.kts | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          stale=$(grep -oE 'dev\.consema:consema-kotlin:[0-9][^`"()）]*' README.md | grep -vxF "dev.consema:consema-kotlin:$version" || true)
          if [ -n "$stale" ]; then
            echo "::error::README.md quick-start Maven coordinates do not pin dev.consema:consema-kotlin:$version (found: $stale)"
            exit 1
          fi
          echo "README Maven coordinates match: dev.consema:consema-kotlin:$version"
          stale=$(grep -oE '当前 [0-9][^）]*' .github/ISSUE_TEMPLATE/bug_report.yml | grep -vxF "当前 $version" || true)
          if [ -n "$stale" ]; then
            echo "::error::.github/ISSUE_TEMPLATE/bug_report.yml does not note '当前 $version' (must match the train bump; found: $stale)"
            exit 1
          fi
          echo "bug-report template version matches: $version"

  # SDK examples gate: kotlin/examples/SdkChain.kt (the committed
  # five-language SDK chain example — parse -> native query -> best-exact
  # projection -> semantic edit -> canonical materialization -> TOML
  # conversion; language-neutral contract reference: consema repository
  # https://github.com/consema/consema/blob/main/docs/cookbook.md) and kotlin/examples/Quickstart.kt (the root README
  # "快速开始" snippet as a committed example — parse -> query -> edit ->
  # render). kotlinc compiles the main sources and the examples together
  # (the kotlin-gates K2JVMCompiler pattern), and both examples are actually
  # run with java. The examples are pure SDK chains (no conformance data),
  # so no multi-repo checkout or provision step is needed.
  examples:
    name: examples (kotlinc + run SdkChain.kt / Quickstart.kt)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: cache kotlinc 2.2.0 distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/kotlinc-2.2.0
          key: kotlinc-2.2.0
      - name: provision kotlinc 2.2.0 + CONSEMA_* environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dist = Join-Path $env:RUNNER_TEMP 'kotlinc-2.2.0'
          # The kotlin-compiler zip extracts a top-level kotlinc/ directory
          # (lib\kotlin-compiler.jar sits under it); the guard must test the
          # real layout so a cache-restored distribution is actually reused
          # instead of being re-downloaded every run.
          if (-not (Test-Path (Join-Path $dist 'kotlinc\lib\kotlin-compiler.jar'))) {
            $zip = Join-Path $env:RUNNER_TEMP 'kotlin-compiler-2.2.0.zip'
            if (-not (Test-Path $zip)) {
              Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip' -OutFile $zip
            }
            # Pinned upstream artifact (JetBrains kotlinc 2.2.0 release):
            # verify the sha256 so an upstream drift or a poisoned cache
            # entry fails the job instead of being used.
            $expectedKotlincSha256 = '1adb6f1a5845ba0aa5a59e412e44c8e405236b957de1a9683619f1dca3b16932'
            $actualKotlincSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
            if ($actualKotlincSha256 -ne $expectedKotlincSha256) {
              throw "kotlin-compiler-2.2.0.zip sha256 mismatch (got $actualKotlincSha256, want $expectedKotlincSha256)"
            }
            Expand-Archive -LiteralPath $zip -DestinationPath $dist -Force
          }
          $compiler = Get-ChildItem -Path $dist -Recurse -Filter 'kotlin-compiler.jar' | Select-Object -First 1
          if (-not $compiler) {
            throw 'kotlinc distribution not found after extraction'
          }
          # Verify the extracted compiler jar on every use — including a
          # cache-restored distribution (the cache key is a constant, so the
          # download branch is not the only supply path).
          $expectedKotlincJarSha256 = 'cb2b7b0b82ad5b6ddc2e8c6c41c73e837a2b42e2abf64af64dda1b6173609790'
          $actualKotlincJarSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $compiler.FullName).Hash
          if ($actualKotlincJarSha256 -ne $expectedKotlincJarSha256) {
            throw "kotlin-compiler.jar sha256 mismatch (got $actualKotlincJarSha256, want $expectedKotlincJarSha256)"
          }
          $kotlincRoot = $compiler.Directory.Parent.FullName
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CONSEMA_KOTLINC=$kotlincRoot`r`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CONSEMA_JAVA_HOME=$env:JAVA_HOME`r`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "KOTLIN_WORK=$env:RUNNER_TEMP\kotlin-work`r`n")
          Write-Output "kotlinc 2.2.0 provisioned at $kotlincRoot"
      # Knit-style doc-example gate (root README quick-start snippet): the
      # README ```kotlin fence must equal the committed examples/Quickstart.kt
      # code body (after the file's header comment and package line), so the
      # "粘贴版与入库版必须保持一致" claim is enforced, not asserted.
      - name: README quick-start fence must match kotlin/examples/Quickstart.kt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $readme = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'README.md') -Raw
          $m = [regex]::Match($readme, '(?s)```kotlin\r?\n(.*?)\r?\n```')
          if (-not $m.Success) {
            throw 'README.md quick-start fence (```kotlin ... ```) not found'
          }
          $fence = ($m.Groups[1].Value -replace "`r", '').Trim()
          $file = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'kotlin/examples/Quickstart.kt') -Raw
          $normalized = ($file -replace "`r", '') -split '(?m)^package consema\.examples\r?\n', 2
          if ($normalized.Count -ne 2) {
            throw 'kotlin/examples/Quickstart.kt must declare package consema.examples'
          }
          $body = $normalized[1].Trim()
          if ($fence -ne $body) {
            throw 'README quick-start fence must equal kotlin/examples/Quickstart.kt (after its header comment and package line)'
          }
          Write-Output 'README quick-start fence matches kotlin/examples/Quickstart.kt'
      # Compiles every main source into one module (internal visibility),
      # then compiles the examples against it and runs both with java.
      - name: compile main sources + examples (K2JVMCompiler) and run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $java = Join-Path $env:CONSEMA_JAVA_HOME 'bin\java.exe'
          if (-not (Test-Path $java)) { throw "JDK 17 not found at $java" }
          $kotlinc = $env:CONSEMA_KOTLINC
          $kotlinDir = Join-Path $env:GITHUB_WORKSPACE 'kotlin'
          $work = Join-Path $env:RUNNER_TEMP 'kotlin-example-work'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Force $work | Out-Null
          $mainOut = Join-Path $work 'main'
          $exampleOut = Join-Path $work 'example'
          New-Item -ItemType Directory -Force $mainOut | Out-Null
          New-Item -ItemType Directory -Force $exampleOut | Out-Null
          & $java -Xmx2g -cp "$kotlinc\lib\*" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler -jvm-target 17 -d $mainOut (Join-Path $kotlinDir 'src\main\kotlin')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stdlib = Join-Path $kotlinc 'lib\kotlin-stdlib.jar'
          & $java -Xmx2g -cp "$kotlinc\lib\*" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler -jvm-target 17 -classpath "$mainOut;$stdlib" -d $exampleOut (Join-Path $kotlinDir 'examples\SdkChain.kt') (Join-Path $kotlinDir 'examples\Quickstart.kt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $java -Xmx2g -cp "$exampleOut;$mainOut;$stdlib" consema.examples.SdkChainKt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $java -Xmx2g -cp "$exampleOut;$mainOut;$stdlib" consema.examples.QuickstartKt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # L5 packaging gate (five-language-ci-design.md §1.1 package row / §5.3
  # L5 row): `gradlew jar` must produce the library jar under
  # kotlin/build/libs/. The committed Gradle wrapper (gradle 8.14) drives
  # the build; setup-gradle caches the Gradle user home (wrapper dist +
  # dependency/Kotlin caches). Nothing is published here, no repository
  # secrets are used, and no conformance data is needed (packaging is
  # data-independent). The gradlew script is committed without the
  # executable bit (100644), so it is invoked through bash on the ubuntu
  # runner.
  kotlin-package:
    name: kotlin package (gradlew jar, jar built)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: cache gradle user home (wrapper dist + dependency caches)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: gradlew jar (JAR task, gradle 8.14 wrapper)
        working-directory: kotlin
        run: bash gradlew jar --no-daemon
      - name: verify the jar artifact (kotlin/build/libs/)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $libs = Join-Path $env:GITHUB_WORKSPACE 'kotlin\build\libs'
          $jar = Get-ChildItem -LiteralPath $libs -Filter '*.jar' | Select-Object -First 1
          if (-not $jar) {
            throw 'no jar produced by gradlew jar'
          }
          $listing = & jar tf $jar.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hasConsema = $listing | Where-Object { $_ -like 'consema/*' } | Select-Object -First 1
          if (-not $hasConsema) {
            throw "jar must contain consema classes: $($jar.Name) (an empty-shell artifact must never pass the release gate)"
          }
          Write-Output "jar verified: $($jar.Name) ($($jar.Length) bytes), contains consema/ classes"

  # Dependency audit (runtimeClasspath), the standing security gate in the
  # aggregate check (G103, 2026-08-14; rs/go/ts/py shape). Identical to the
  # audit.yml runtime-classpath job, which adds the daily cron that
  # ci-kotlin.yml cannot express — the aggregate check's needs must name
  # jobs inside this workflow. The runtime classpath carries only the Kotlin
  # platform (kotlin-stdlib + its transitive org.jetbrains:annotations), so
  # the assertion allows exactly those groups. This job is a runtimeClasspath
  # group assertion, not a CVE-database scan — the audit.yml header documents
  # that standing gap.
  runtime-classpath-audit:
    name: runtimeClasspath audit (gradlew dependencies, zero runtime deps)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: cache gradle user home (wrapper dist + dependency caches)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: gradlew dependencies --configuration runtimeClasspath (test-only deps — runtime classpath = Kotlin platform only)
        shell: pwsh
        working-directory: kotlin
        run: |
          $ErrorActionPreference = 'Stop'
          $output = .\gradlew.bat dependencies --configuration runtimeClasspath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $allowed = @('org.jetbrains.kotlin', 'org.jetbrains', 'project')
          $violations = @()
          foreach ($line in $output) {
            if ($line -match '^\s*(?:\|\s+)*[+\\]---\s+([^:\s]+):') {
              $group = $Matches[1]
              if ($allowed -notcontains $group) { $violations += $line }
            }
          }
          if ($violations.Count -gt 0) {
            throw "runtimeClasspath resolved third-party dependencies (test-only-dependency policy violated):`n" + ($violations -join "`n")
          }
          Write-Output 'runtimeClasspath: only the Kotlin platform (kotlin-stdlib) — every declared configuration is test-scoped (test-only deps)'

  # Alls-green aggregate gate (tokio/pydantic pattern): `check (all gates
  # green)` is the SINGLE required check for branch protection on this
  # repository; every other job stays non-required. `if: always()` is
  # mandatory — otherwise GitHub skips this job when a dependency fails and
  # a skipped check can be treated as success. `jobs: ${{ toJSON(needs) }}`
  # is the action's mandatory input (it does not read the needs context
  # automatically). No job here uses continue-on-error, so the
  # allowed-failures list is empty.
  check:
    name: check (all gates green)
    if: always()
    needs: [kotlin-gates, kotlin-conformance, kotlin-differential, check-version-consistency, examples, kotlin-package, runtime-classpath-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-failures: ''
          jobs: ${{ toJSON(needs) }}
