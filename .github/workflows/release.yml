# Consema Kotlin release: tag-triggered Maven Central publish of
# dev.consema:consema-kotlin (top-tier bar: 半自动发布, kotlinx 凭证专人
# precedent — credentials are user-side actions, see RELEASING.md §2).
#
# The committed Gradle wrapper (kotlin/gradlew.bat, gradle 8.14 — landed
# c60d31a/b640af6) drives the CI gates, Dependabot resolution, and this
# publish path: `gradlew publish` downloads the distribution through the
# wrapper, whose pinned distributionSha256Sum (kotlin/gradle/wrapper/
# gradle-wrapper.properties) verifies the downloaded bytes — no unverified
# Gradle download can influence a published artifact.
#
# REQUIRED user configuration before the first tag push (the workflow is
# complete but will fail without these; they are deliberately NOT
# placeholder-secret gated so the failure is explicit):
#   - OSSRH_USERNAME / OSSRH_PASSWORD: Sonatype Central Portal credentials
#     (portal token name/value) — publish target is the portal deploy
#     endpoint (build.gradle.kts publishing block).
#   - SIGNING_KEY / SIGNING_PASSWORD: PGP key pair for artifact signing
#     (ASCII-armored private key + passphrase; the matching public key must
#     be registered on keys.openpgp.org / the portal).
#   - The namespace dev.consema must be claimed on the Central Portal and
#     the first publication verified once (see RELEASING.md).
name: Release to Maven Central

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: gradle publish (dev.consema:consema-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Release guard (rc 前六角色审计 P1, 2026-08-12): the tag minus the
      # leading v must equal the rootProject version, otherwise a mismatched
      # tag could publish the wrong version to Maven Central.
      - name: verify tag matches manifest version (build.gradle.kts)
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' kotlin/build.gradle.kts | head -n 1)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ -z "$manifest" ]]; then
            echo "::error::could not read version from kotlin/build.gradle.kts"
            exit 1
          fi
          if [[ "$tag" != "$manifest" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match build.gradle.kts version $manifest"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches build.gradle.kts version $manifest"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # No Gradle caching on this tag-triggered publishing workflow: a
      # poisoned cache entry must never influence a published artifact
      # (zizmor cache-poisoning). The wrapper's pinned distributionSha256Sum
      # verifies the distribution download itself.
      - name: gradlew test (release-path test gate)
        working-directory: kotlin
        run: bash gradlew test --no-daemon
      - name: gradlew publish (portal deploy, signed artifacts)
        working-directory: kotlin
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: bash gradlew publish --no-daemon
