# Consema Kotlin release: tag-triggered Maven Central publish of
# dev.consema:consema-kotlin (top-tier bar: 半自动发布, kotlinx 凭证专人
# precedent — credentials are user-side actions, see RELEASING.md §2).
#
# The committed Gradle wrapper (kotlin/gradlew.bat, gradle 8.14 — landed
# c60d31a/b640af6) drives the CI gates, Dependabot resolution, and this
# publish path: `gradlew publish` downloads the distribution through the
# wrapper, whose pinned distributionSha256Sum (kotlin/gradle/wrapper/
# gradle-wrapper.properties) verifies the downloaded bytes. That download
# verification covers the Gradle distribution only: build-time plugin and
# dependency resolution is NOT checksum-verified (the standing
# runtimeClasspath audit is .github/workflows/audit.yml).
#
# Release-path test gate (adversarial audit G45, 2026-08-14): `gradlew
# test` runs ConformanceRunnerTest and FixtureRoundTripTest, which resolve
# conformance/* and docs/fc-manifest-0.13.0.json by repository-relative
# path from CONSEMA_REPO — without the provisioned data those tests fail
# at construction. Like the CI workflows, this job checks out
# consema/consema (pinned to 9aa6597, the 2026-08-15 wave-4 R5 unified
# provision pin carrying the cfd6e296 519-case conformance snapshot) and
# copies the conformance data into the workspace root before
# testing (multi-repo checkout + provision pattern, ci-kotlin.yml).
#
# REQUIRED user configuration before the first tag push (the workflow is
# complete but will fail without these; they are deliberately NOT
# placeholder-secret gated so the failure is explicit):
#   - OSSRH_USERNAME / OSSRH_PASSWORD: Sonatype Central Portal credentials
#     (portal token name/value) — publish target is the portal deploy
#     endpoint (build.gradle.kts publishing block).
#   - SIGNING_KEY / SIGNING_PASSWORD: PGP key pair for artifact signing
#     (ASCII-armored private key + passphrase; the matching public key must
#     be registered on keys.openpgp.org / the portal).
#   - The namespace dev.consema must be claimed on the Central Portal and
#     the first publication verified once (see RELEASING.md).
name: Release to Maven Central

on:
  push:
    tags: ['v*']

# Concurrency guard (W3-27, 2026-08-14): a tag re-push or a continued run
# must not start a second concurrent publish (same shape as the
# consema-go/consema-ts release workflows).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: gradle publish (dev.consema:consema-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Release guard (G71, 2026-08-14; same gate shape as the
      # consema-go/consema-rs/consema-py release.yml verify steps): the tag
      # must point at a commit on origin/main — a tag pushed from a stale or
      # divergent commit must not publish old code. The workflow runs after
      # the push, when origin/main may already have advanced past the tag's
      # commit, so a realtime HEAD comparison would fail a legitimately
      # pushed tag; ancestry is used instead (git merge-base --is-ancestor).
      - name: verify tag points at a commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag $GITHUB_REF_NAME does not point at a commit on origin/main"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME points at a commit on origin/main"
      # Release guard (rc 前六角色审计 P1, 2026-08-12): the tag minus the
      # leading v must equal the rootProject version, otherwise a mismatched
      # tag could publish the wrong version to Maven Central.
      - name: verify tag matches manifest version (build.gradle.kts)
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' kotlin/build.gradle.kts | head -n 1)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ -z "$manifest" ]]; then
            echo "::error::could not read version from kotlin/build.gradle.kts"
            exit 1
          fi
          if [[ "$tag" != "$manifest" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match build.gradle.kts version $manifest"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches build.gradle.kts version $manifest"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # Gradle wrapper jar integrity (G87, 2026-08-14): the committed
      # kotlin/gradle/wrapper/gradle-wrapper.jar is a binary with no
      # in-repo integrity anchor — wrapper-validation-action compares it
      # with the official distribution before any wrapper step runs.
      - name: validate the committed Gradle wrapper jar (official distribution)
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0
      # No Gradle caching on this tag-triggered publishing workflow: a
      # poisoned cache entry must never influence a published artifact
      # (zizmor cache-poisoning). The wrapper's pinned distributionSha256Sum
      # verifies the distribution download itself.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: 9aa65976d51d27f93afcffca957475368a69e93b # wave-4 unified provision pin (mother-repo HEAD; fc-manifest sha256 3fdf9a77)
          path: consema-repo
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # Wave-4 R5 manifest sha256 assertion (unified provision pin
          # 9aa6597): the pinned checkout must carry exactly the digest
          # recorded at the pin — silent manifest drift fails the job.
          $expectedDigest = '3fdf9a77323705dfaf24e8f3a822b9217da20dd243e668165f4d06a9ea64676d'
          $actualDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json')).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest) {
            throw "fc-manifest sha256 mismatch after provision: expected $expectedDigest, got $actualDigest"
          }
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      # Release-path test gate: the differential legs without their golden
      # env vars (no CONSEMA_DIFFERENTIAL_* / CONSEMA_EXCHANGE_* here) print
      # a documented [SKIP] and pass (§0.2 skip discipline) — wave-4 R47
      # asserts the skip upper bound from the JUnit XML results, so a new
      # silent skip cannot grow the set at release time.
      - name: gradlew test (release-path test gate, provisioned conformance data)
        working-directory: kotlin
        env:
          CONSEMA_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash gradlew test --no-daemon
          skipped=$(find kotlin/build/test-results/test -name '*.xml' -exec grep -ho 'skipped="[0-9]*"' {} + 2>/dev/null | sed -E 's/skipped="([0-9]+)"/\1/' | awk '{s+=$1} END {print s+0}')
          if [ "$skipped" -gt 4 ]; then
            echo "::error::unexpectedly many skipped tests: $skipped (at most 4 documented env-gated differential legs may skip — a new silent skip must not grow this set)"
            exit 1
          fi
          echo "skipped tests: $skipped (<= 4 documented env-gated differential legs)"
      - name: gradlew publish (portal deploy, signed artifacts)
        working-directory: kotlin
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: bash gradlew publish --no-daemon
