# Consema Kotlin release: tag-triggered Maven Central publish of
# dev.consema:consema-kotlin (top-tier bar: 半自动发布, kotlinx 凭证专人
# precedent — credentials are user-side actions, see RELEASING.md §2).
#
# The committed Gradle wrapper (kotlin/gradlew.bat, gradle 8.14 — landed
# c60d31a/b640af6) drives the CI gates, Dependabot resolution, and this
# publish path: `gradlew publish` downloads the distribution through the
# wrapper, whose pinned distributionSha256Sum (kotlin/gradle/wrapper/
# gradle-wrapper.properties) verifies the downloaded bytes. That download
# verification covers the Gradle distribution only: build-time plugin and
# dependency resolution is NOT checksum-verified (the standing
# runtimeClasspath audit is .github/workflows/audit.yml).
#
# Release-path test gate (adversarial audit G45, 2026-08-14): `gradlew
# test` runs ConformanceRunnerTest and FixtureRoundTripTest, which resolve
# conformance/* and docs/fc-manifest-0.13.0.json by repository-relative
# path from CONSEMA_REPO — without the provisioned data those tests fail
# at construction. Like the CI workflows, this job checks out
# consema/consema (pinned to ccc9943, the 2026-08-15 wave-4 R5 unified
# provision pin re-anchored by F2, carrying the cfd6e296 519-case
# conformance snapshot) and
# copies the conformance data into the workspace root before
# testing (multi-repo checkout + provision pattern, ci-kotlin.yml).
#
# REQUIRED user configuration before the first tag push (failure behavior
# differs per pair — wave-5 truthing, 2026-08-15):
#   - OSSRH_USERNAME / OSSRH_PASSWORD: Sonatype Central Portal credentials
#     (portal token name/value) — publish target is the portal deploy
#     endpoint (build.gradle.kts publishing block). Missing -> the publish
#     step fails explicitly (portal auth rejection).
#   - SIGNING_KEY / SIGNING_PASSWORD: PGP key pair for artifact signing
#     (ASCII-armored private key + passphrase; the matching public key must
#     be registered on keys.openpgp.org / the portal). Missing -> signing
#     is SILENTLY SKIPPED (build.gradle.kts signing block: 'When absent ...
#     signing is skipped so gradle build keeps working') and `gradlew
#     publish` uploads UNSIGNED artifacts to the portal staging endpoint —
#     the failure is NOT explicit at workflow level; the portal/consumer
#     side rejects or flags unsigned artifacts (RELEASING.md §3.1 lists
#     'verify the signature' as a post-release check for this reason).
#   - The namespace dev.consema must be claimed on the Central Portal and
#     the first publication verified once (see RELEASING.md).
name: Release to Maven Central

on:
  push:
    tags: ['v*']

# Concurrency guard (W3-27, 2026-08-14; wave-5 truthing): a tag re-push or
# a continued run must not run a second publish concurrently. Wave-5
# (2026-08-15): cancel-in-progress is FALSE — a mid-publish cancel on an
# immutable registry (Maven Central staging multi-artifact upload) can
# leave partial publish state with no recovery path (a re-push then fails
# on duplicate version). Queuing serializes instead: a re-push during a
# publish waits for the in-progress run to finish and then fails loudly on
# the duplicate version at the portal, leaving no partial state. (Same
# shape as the consema-go/consema-rs/consema-ts/consema-py workflows
# originally, which still use cancel-in-progress: true — kt diverges
# deliberately.)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: gradle publish (dev.consema:consema-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Release guard (G71, 2026-08-14; same gate shape as the
      # consema-go/consema-rs/consema-py release.yml verify steps): the tag
      # must point at a commit on origin/main — a tag pushed from a stale or
      # divergent commit must not publish old code. The workflow runs after
      # the push, when origin/main may already have advanced past the tag's
      # commit, so a realtime HEAD comparison would fail a legitimately
      # pushed tag; ancestry is used instead (git merge-base --is-ancestor).
      # The GITHUB_SHA of a tag-push event is the tag object id; ^{commit}
      # peels annotated tags to the commit they point at (a no-op for
      # lightweight tags and plain commits), so both tag forms are accepted
      # (wave-4 R7; locally rehearsed: tip/ancestor pass, off-main fails).
      - name: verify tag points at a commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          peeled="${GITHUB_SHA}^{commit}"
          if ! git merge-base --is-ancestor "$peeled" FETCH_HEAD; then
            echo "::error::tag $GITHUB_REF_NAME does not point at a commit on origin/main (peeled ${GITHUB_SHA}^{commit})"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME (peeled $peeled) points at a commit on origin/main"
      # Release guard (rc 前六角色审计 P1, 2026-08-12; wave-5 hardening,
      # 2026-08-15): the tag minus the leading v must equal the rootProject
      # version, otherwise a mismatched tag could publish the wrong version
      # to Maven Central. Wave-5: (a) the extraction is anchored to the
      # '// rootProject version' declaration (a plain first-match sed would
      # silently switch to any top-level 'version = ...' property declared
      # above it — same first-match family as the CI gate); (b) the check
      # now re-asserts the FULL version-consistency surface (the
      # check-version-consistency job's four carriers — README Version
      # line, README Maven coordinates, bug-report template note,
      # TestFixtures.kt literal), because a tag push bypasses main-CI:
      # release-time is the last gate before Maven Central.
      - name: verify tag matches the full version surface (build.gradle.kts + README line + Maven coordinates + bug-report note + test fixture)
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(awk '/rootProject version/{f=1} f && /^version[[:space:]]*=[[:space:]]*"/{print; exit}' kotlin/build.gradle.kts | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          if [[ -z "$manifest" ]]; then
            echo "::error::could not read rootProject version from kotlin/build.gradle.kts"
            exit 1
          fi
          if [[ "$tag" != "$manifest" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match build.gradle.kts version $manifest"
            exit 1
          fi
          # Same assertions as the ci-kotlin.yml check-version-consistency
          # job (wave-4 R36): whole-line / whole-token matches so the
          # rc->GA direction cannot pass via substring.
          grep -qxF "Version: $manifest" README.md || {
            echo "::error::README.md does not declare 'Version: $manifest' as a whole line"
            exit 1
          }
          grep -qF 'dev.consema:consema-kotlin:' README.md || {
            echo "::error::README.md quick-start Maven coordinates are missing"
            exit 1
          }
          stale="$(grep -oE 'dev\.consema:consema-kotlin:[0-9][^`"()）]*' README.md | grep -vxF "dev.consema:consema-kotlin:$manifest" || true)"
          if [[ -n "$stale" ]]; then
            echo "::error::README.md Maven coordinates do not pin dev.consema:consema-kotlin:$manifest (found: $stale)"
            exit 1
          fi
          grep -qF "当前 $manifest" .github/ISSUE_TEMPLATE/bug_report.yml || {
            echo "::error::bug_report.yml does not note '当前 $manifest'"
            exit 1
          }
          grep -qF "version = \"$manifest\"" kotlin/src/test/kotlin/toml/TestFixtures.kt || {
            echo "::error::toml/TestFixtures.kt does not pin 'version = \"$manifest\"'"
            exit 1
          }
          echo "tag $GITHUB_REF_NAME matches the full version surface: $manifest"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # Gradle wrapper jar integrity (G87, 2026-08-14): the committed
      # kotlin/gradle/wrapper/gradle-wrapper.jar is a binary with no
      # in-repo integrity anchor — wrapper-validation-action compares it
      # with the official distribution before any wrapper step runs.
      - name: validate the committed Gradle wrapper jar (official distribution)
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0
      # No Gradle caching on this tag-triggered publishing workflow: a
      # poisoned cache entry must never influence a published artifact
      # (zizmor cache-poisoning). The wrapper's pinned distributionSha256Sum
      # verifies the distribution download itself.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: ccc99430a6e3003bc1b0830d81cbad245323f0a4 # wave-4 R5 unified provision pin, F2 re-anchored to mother-repo HEAD (fc-manifest sha256 5cb4ab51)
          path: consema-repo
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # Wave-4 R5 manifest sha256 assertion (unified provision pin
          # ccc9943): the pinned checkout must carry exactly the digest
          # recorded at the pin — silent manifest drift fails the job.
          $expectedDigest = '5cb4ab518cc3b3e1754a07f21953693b4b9ec113443d44c6ed8a6d4fa8faa6f8'
          $actualDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json')).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest) {
            throw "fc-manifest sha256 mismatch after provision: expected $expectedDigest, got $actualDigest"
          }
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      # Release-path test gate: the differential legs without their golden
      # env vars (no CONSEMA_DIFFERENTIAL_* / CONSEMA_EXCHANGE_* here)
      # print a documented [SKIP] and pass (§0.2 skip discipline) — wave-4
      # R47 asserts the skip upper bound from the JUnit XML results, so a
      # new silent skip cannot grow the set at release time. Measured
      # 2026-08-15: exactly the three env-gated differential legs print a
      # marker (differentialByteParity / differentialNormalized /
      # protocolExchange; gradle aggregates system-out per suite, so the
      # bound is on [SKIP] marker occurrences in the XML). Wave-5 H4
      # (2026-08-15): the marker glob was previously relative to this
      # step's working-directory (kotlin), resolving to
      # kotlin/kotlin/build/... — always empty, skipped pinned at 0 — a
      # dead gate; the glob is now absolute per the twin gate
      # (ci-kotlin.yml, Join-Path $env:GITHUB_WORKSPACE 'kotlin\build\
      # test-results\test') with a not-found guard, so a missing results
      # directory fails the job instead of passing silently.
      - name: gradlew test (release-path test gate, provisioned conformance data)
        working-directory: kotlin
        env:
          CONSEMA_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash gradlew test --no-daemon
          skipped=$(python3 -c '
          import glob, os, re
          result_dir = os.path.join(os.environ["GITHUB_WORKSPACE"], "kotlin", "build", "test-results", "test")
          if not os.path.isdir(result_dir):
              raise SystemExit("gradle test results not found: " + result_dir)
          n = 0
          for f in glob.glob(os.path.join(result_dir, "TEST-*.xml")):
              n += len(re.findall(r"\[SKIP\]", open(f, encoding="utf-8").read()))
          print(n)
          ')
          if [ "$skipped" -gt 3 ]; then
            echo "::error::unexpectedly many [SKIP] markers: $skipped (at most 3 env-gated differential legs may print a marker — a new silent skip must not grow this set)"
            exit 1
          fi
          echo "skipped [SKIP] markers: $skipped (<= 3 env-gated differential legs)"
      # Wave-5 zero-test lower bound (2026-08-15): gradle prints 'No tests
      # found for given includes' and exits 0 when the test source set
      # silently disappears (misconfigured sourceSet / path drift) — the
      # whole suite could vanish while the release gate stays green. The
      # JUnit XML must contain at least one executed testcase
      # (ConformanceRunnerTest's digest/18-519 pins ride the same run).
      - name: assert the gradle test run executed testcases (zero-test lower bound)
        shell: bash
        run: |
          set -euo pipefail
          result_dir="${GITHUB_WORKSPACE}/kotlin/build/test-results/test"
          test -d "$result_dir" || {
            echo "::error::gradle test results not found: $result_dir"
            exit 1
          }
          total="$(python3 -c '
          import glob, os, re
          n = 0
          for f in glob.glob(os.path.join(os.environ["GITHUB_WORKSPACE"], "kotlin", "build", "test-results", "test", "TEST-*.xml")):
              n += len(re.findall(r"<testcase ", open(f, encoding="utf-8").read()))
          print(n)
          ')"
          if [ "$total" -eq 0 ]; then
            echo "::error::gradle test ran with zero testcases — the test source set may have silently disappeared"
            exit 1
          fi
          echo "gradle test executed $total testcases"
      # Wave-5 jar-content gate (2026-08-15): `gradlew test` compiles and
      # tests the classes directory, never the jar artifact — a jar
      # packaging regression (sourceSet exclusion, silent empty jar task)
      # would publish an empty shell to Maven Central. The kotlin-package
      # job's jar-content assertion (consema/ classes present) is
      # re-run here on the tag path, on the exact artifact publish will
      # upload (same gradle wrapper, same working directory).
      - name: gradlew jar + verify the artifact contains consema classes
        working-directory: kotlin
        run: |
          set -euo pipefail
          bash gradlew jar --no-daemon
          # gradlew jar runs with working-directory kotlin, so the jar
          # lives at kotlin/build/libs relative to the workspace root.
          jar_file="$(ls "$GITHUB_WORKSPACE/kotlin/build/libs/"consema-kotlin-*.jar 2>/dev/null | head -n 1 || true)"
          if [[ -z "$jar_file" ]]; then
            echo "::error::no consema-kotlin jar produced by gradlew jar"
            exit 1
          fi
          if ! jar tf "$jar_file" | grep -q '^consema/'; then
            echo "::error::jar must contain consema/ classes: $jar_file (an empty-shell artifact must never be published)"
            exit 1
          fi
          echo "jar verified: $(basename "$jar_file") contains consema/ classes"
      - name: gradlew publish (portal deploy, signed artifacts)
        working-directory: kotlin
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: bash gradlew publish --no-daemon
