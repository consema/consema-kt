# Dependabot version updates: gradle ecosystem. The manifest is
# kotlin/build.gradle.kts (single module, kotlin("jvm") 2.2.0, test-scoped
# dependencies only), so the directory is /kotlin — no root build file
# exists, and a "/" directory would not find the manifest.
#
# The committed Gradle wrapper (kotlin/gradlew.bat, gradle 8.14 — c60d31a)
# means Dependabot resolves manifests with the repo's own toolchain, and
# Gradle-wrapper updates (gradle/wrapper/*) are now possible; the earlier
# "no wrapper" limitation is obsolete.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/kotlin"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
